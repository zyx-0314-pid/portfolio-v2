    <script>
        (function () {
            try {
                var storedTheme = localStorage.getItem('portfolio-theme');
                var theme = storedTheme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
